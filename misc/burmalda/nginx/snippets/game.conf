root /usr/share/nginx/html;
index Burmalda.html;

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

# Always revalidate (ETag/Last-Modified) so a rebuild is picked up immediately
# and the browser can never keep a stale/partial .pck or .wasm.
expires -1;

location = / {
    try_files /Burmalda.html =404;
}

location = /Burmalda.html {
    try_files /Burmalda.html =404;
}

# The .pck is small and already binary: serve it identity-encoded so no
# proxy/browser compression layer can ever hand Godot a transformed pack.
location ~* \.pck$ {
    gzip off;
    gzip_static off;
    try_files $uri =404;
}

location ~* \.gz$ {
    return 404;
}

location / {
    try_files $uri $uri/ =404;
}
