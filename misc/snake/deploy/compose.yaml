services:
  snake:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Optional: overrides /flag.txt. The platform writes the flag to /flag.txt.
      # FLAG: "ctfcup{test_flag}"
      # Optional: snake length that wins; defaults to the full board (61).
      # WIN_LENGTH: "61"
      ADDR: ":8080"
    restart: unless-stopped
