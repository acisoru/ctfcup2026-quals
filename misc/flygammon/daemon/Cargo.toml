[package]
name = "flygammon-daemon"
version = "0.1.0"
edition = "2021"
description = "Off-chain fruit-fly oracle: posts proven dice and plays the fly's 2-ply moves"

[dependencies]
flygammon = { path = "../flygammon" }
burn = { version = "0.21", features = ["ndarray"] }
alloy = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
num-bigint = "0.4"
num-traits = "0.2"
sha3 = "0.10"
rand = "0.8"
anyhow = "1"
# front-door proxy (daemon/src/bin/flygammon-proxy.rs); versions are already in
# the tree via alloy, so this adds no new downloads
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"

[profile.release]
opt-level = 3
