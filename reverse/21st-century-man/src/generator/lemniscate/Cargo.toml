[package]
name = "text_lemniscate_rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "text_lemniscate"
path = "src/lib.rs"

[[bin]]
name = "text_lemniscate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
faer = "0.24.4"
geo = "0.33.1"
num-complex = "0.4.6"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ttf-parser = "0.25.1"

[profile.release]
opt-level = 3
codegen-units = 4
